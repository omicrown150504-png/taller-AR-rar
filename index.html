<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Taller AR - Omar Quispe</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      .ui-capa {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        font-family: sans-serif;
        color: white;
        text-shadow: 2px 2px 4px #000000;
      }
      button {
        padding: 12px 20px;
        font-size: 16px;
        margin-top: 10px;
        cursor: pointer;
        background-color: #f0f0f0;
        border: 1px solid #333;
        border-radius: 5px;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <div class="ui-capa">
      <h2>Estudiante: Omar Quispe</h2>
      <p>Tamaño: <span id="etiqueta-estado">Normal</span></p>
      <button id="boton-escala">Cambiar tamaño</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

      <!-- Tarjeta A con interpolación y suavizado de movimiento -->
      <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-box id="figura-cubo" position="0 0.5 0" material="color: blue" scale="1 1 1"></a-box>
      </a-marker>

      <!-- Tarjeta B con interpolación y suavizado de movimiento -->
      <a-marker preset="kanji" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-sphere id="figura-esfera" position="0 0.5 0" radius="0.5" material="color: red" scale="1 1 1"></a-sphere>
      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>

    <script>
      const boton = document.getElementById('boton-escala');
      const etiqueta = document.getElementById('etiqueta-estado');
      const cubo = document.getElementById('figura-cubo');
      const esfera = document.getElementById('figura-esfera');

      let tamañoAmpliado = false;

      boton.addEventListener('click', () => {
        tamañoAmpliado = !tamañoAmpliado; 

        if (tamañoAmpliado) {
          cubo.setAttribute('scale', '1.5 1.5 1.5');
          esfera.setAttribute('scale', '1.5 1.5 1.5');
          etiqueta.textContent = 'Ampliado'; 
        } else {
          cubo.setAttribute('scale', '1 1 1');
          esfera.setAttribute('scale', '1 1 1');
          etiqueta.textContent = 'Normal'; 
        }
      });
    </script>
  </body>
</html>
